name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Compile
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/com/example/Main.java
          echo "编译成功!"
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: classes
          path: build/classes/
