name: Build Fabric Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Compile Java
        run: |
          mkdir -p build/classes
          javac -d build/classes -source 21 -target 21 src/main/java/com/虫巢计划/*.java
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chongnao-mod
          path: build/classes/
