name: Build Fabric Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Build with retry
        run: |
          for i in 1 2 3; do
            ./gradlew build --no-daemon && exit 0
            echo "构建失败，第 $i 次重试..."
            sleep 5
          done
          exit 1
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 虫巢计划-mod
          path: build/libs/*.jar
